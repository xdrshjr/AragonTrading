<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Live trade panel input overlap repro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 24px;
      background: #1a1915;
      color: #ece8df;
      font-family: Inter, "Segoe UI", sans-serif;
      font-size: 12px;
    }
    .case { margin-bottom: 18px; }
    .label { margin-bottom: 6px; color: #9b958a; }
    .row {
      width: 420px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border: 1px solid #3a382e;
      border-radius: 10px;
      background: #232118;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
    }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .w-16 { width: 4rem; }
    .w-20 { width: 5rem; }
    /*
      This order matches the compiled Tailwind CSS in apps/web/.next:
      w-full appears after w-16/w-20, so equal-specificity width:100%
      wins when the Input primitive emits both classes.
    */
    .w-full { width: 100%; }
    button {
      min-width: 0;
      border: 1px solid #3a382e;
      border-radius: 7px;
      background: transparent;
      color: #9b958a;
      padding: 4px;
    }
    input {
      border: 1px solid #3a382e;
      border-radius: 10px;
      background: #232118;
      color: #ece8df;
      padding: 8px 12px;
      text-align: right;
    }
    input[type="range"] {
      height: 6px;
      padding: 0 7px;
      accent-color: #d98a6e;
    }
    pre {
      margin-top: 8px;
      padding: 8px;
      background: #2c2a20;
      border-radius: 8px;
      color: #ece8df;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="case">
    <div class="label">Broken leverage row: presets + Input(w-full + w-16)</div>
    <div class="row" id="broken-leverage">
      <div class="grid flex-1" id="broken-presets">
        <button>1x</button><button>3x</button><button>5x</button>
        <button>10x</button><button>20x</button>
      </div>
      <input id="broken-leverage-input" class="w-full w-16" value="20" />
    </div>
  </div>

  <div class="case">
    <div class="label">Broken quantity row: Slider(flex-1) + Input(w-full + w-20)</div>
    <div class="row" id="broken-quantity">
      <input id="broken-slider" type="range" class="flex-1 w-full" value="0" />
      <input id="broken-quantity-input" class="w-full w-20" value="" />
    </div>
  </div>

  <div class="case">
    <div class="label">Fixed pattern: fixed-width wrapper + inner Input(w-full)</div>
    <div class="row" id="fixed-leverage">
      <div class="grid flex-1" id="fixed-presets">
        <button>1x</button><button>3x</button><button>5x</button>
        <button>10x</button><button>20x</button>
      </div>
      <div class="w-16 shrink-0" id="fixed-wrapper">
        <input id="fixed-input" class="w-full" value="20" />
      </div>
    </div>
  </div>

  <pre id="result"></pre>
  <script>
    function width(id) {
      return Math.round(document.getElementById(id).getBoundingClientRect().width);
    }
    const result = {
      brokenLeverageRow: width("broken-leverage"),
      brokenPresets: width("broken-presets"),
      brokenLeverageInput: width("broken-leverage-input"),
      brokenQuantityRow: width("broken-quantity"),
      brokenSlider: width("broken-slider"),
      brokenQuantityInput: width("broken-quantity-input"),
      fixedLeverageRow: width("fixed-leverage"),
      fixedPresets: width("fixed-presets"),
      fixedWrapper: width("fixed-wrapper"),
      fixedInput: width("fixed-input")
    };
    document.getElementById("result").textContent = JSON.stringify(result, null, 2);
  </script>
</body>
</html>
