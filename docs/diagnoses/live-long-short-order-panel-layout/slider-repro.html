<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<style>
  /* Design tokens copied from apps/web/app/globals.css (.dark) */
  :root.dark { --surface-2:#2c2a20; --accent:#d98a6e; --border:#3a382e; --bg:#1a1915; --muted:#9b958a; }
  body { background:#1a1915; color:#ece8df; font-family:sans-serif; margin:0; padding:16px; width:420px; }
  .row { display:flex; align-items:center; gap:8px; margin:18px 0; }
  .label { font-size:11px; color:#9b958a; margin-bottom:6px; }
  .num { width:80px; height:34px; border:1px solid #3a382e; background:#232118; border-radius:10px; color:#ece8df; text-align:right; padding:0 8px; }

  /* EXACT compiled CSS for the .appearance-none utility from .next build:
     .appearance-none{-webkit-appearance:none;-moz-appearance:none;appearance:none} */
  .appearance-none{-webkit-appearance:none;-moz-appearance:none;appearance:none}

  /* The current ui/index.tsx Slider class string, expressed as plain CSS:
     "h-1.5 w-full cursor-pointer appearance-none rounded-full bg-[var(--surface-2)] accent-[var(--accent)]" */
  .slider-current{
    height:6px; width:100%; cursor:pointer; border-radius:9999px;
    background:var(--surface-2); accent-color:var(--accent);
  }

  /* A correctly-styled range for comparison (adds the missing thumb pseudo-elements). */
  .slider-fixed{ height:6px; width:100%; cursor:pointer; border-radius:9999px; background:var(--surface-2); -webkit-appearance:none; appearance:none; }
  .slider-fixed::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:9999px; background:var(--accent); margin-top:-5px; }
  .slider-fixed::-moz-range-thumb{ width:16px; height:16px; border:0; border-radius:9999px; background:var(--accent); }
</style>
</head>
<body>
  <div class="label">CURRENT — Slider primitive at value=0 (appearance-none, NO thumb CSS)</div>
  <div class="row">
    <input type="range" class="slider-current appearance-none" min="0" max="100" step="1" value="0" style="flex:1">
    <input class="num" value="">
  </div>

  <div class="label">CURRENT — Slider primitive at value=40</div>
  <div class="row">
    <input type="range" class="slider-current appearance-none" min="0" max="100" step="1" value="40" style="flex:1">
    <input class="num" value="">
  </div>

  <div class="label">FIXED — same range WITH ::-webkit-slider-thumb styling, value=40</div>
  <div class="row">
    <input type="range" class="slider-fixed" min="0" max="100" step="1" value="40" style="flex:1">
    <input class="num" value="">
  </div>
</body>
</html>
