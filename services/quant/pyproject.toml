# pytest / 工具配置（依赖见 requirements.txt，spec §8.3 "pyproject.toml 或 requirements.txt"）
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 裸跑 pytest 默认排除真实网络用例（不污染离线 CI）；opt-in 用 `pytest -m network` (C4)
# `audit` 同款 opt-in（ai-trade-loss-and-liveness-hardening R10）：它读的是**用户的真实生产库**
# （119 MB）与后端日志（253 MB），既不该进 CI，也不该在别人的机器上凭空失败。
# **默认排除不是自动的**：`addopts` 与 `markers` 两处都要写——只加 markers 会让它照进全量跑，
# 只加 addopts 会让 pytest 对未注册 marker 告警。
addopts = "-m 'not network and not audit'"
markers = [
    "network: 需真实 OKX 连通的端到端用例（默认排除，opt-in: pytest -m network）",
    "audit: 读真实生产库 / 日志的证据复算（默认排除，opt-in: pytest -m audit）",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# 显式钉规则集，不吃 ruff 默认集的版本漂移（resilience-and-hci-hardening D9）。
# 只选「一定是缺陷」的两类：pyflakes（未用导入 / 未用变量 / 未定义名 / 重复定义）与语法、运行时错误。
# **刻意不选 B008**——FastAPI 的 `Depends()` 写在默认参数里是框架惯例，选它会产出 141 条假阳，
# 而一道会报假阳的门禁只会被训练成「一律忽略」，那等于没有门禁。
select = ["F", "E9"]
