<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Aragon Trading</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #12151c;
        --ink: #e8e6e1;
        --muted: #8b8a86;
        --accent: #cc785c; /* Anthropic clay */
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      /* 无边框加载窗：仅顶部一条拖拽带可移动窗口（仿应用 48px 顶栏）。
         整页 drag 会在 loadFile→loadURL 跨文档导航后残留、吞掉应用内容区的点击，
         故收敛为顶部拖拽带，既保留慢启动时可拖动加载窗，又不让整窗成为死区（spec §4.5 / D7 / R-4）。 */
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 48px;
        -webkit-app-region: drag;
      }
      .win-close {
        position: fixed;
        top: 0;
        right: 0;
        width: 46px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .win-close:hover { background: #e81123; color: #fff; }
      .win-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), #a85c45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        color: #1a120e;
        box-shadow: 0 10px 30px rgba(204, 120, 92, 0.25);
      }
      .title { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
      .sub { font-size: 13px; color: var(--muted); }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(232, 230, 225, 0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="drag-bar" aria-hidden="true"></div>
    <button id="loading-close" class="win-close" type="button" aria-label="关闭" title="关闭">
      <svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
        <path d="M1 1l9 9M10 1l-9 9" stroke="currentColor" stroke-width="1.2" fill="none" />
      </svg>
    </button>
    <div class="wrap">
      <div class="mark">A</div>
      <div class="title">Aragon Trading</div>
      <div class="spinner"></div>
      <div class="sub">正在启动 Aragon 引擎…（首次启动需编译/解压，请稍候）</div>
    </div>
    <script src="./loading.js"></script>
  </body>
</html>
