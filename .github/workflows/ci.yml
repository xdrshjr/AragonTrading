name: CI

# 守护回归：后端 pytest（不含 network）+ 前端 tsc / vitest / build（spec §4.5 / F5）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, no network)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # pyproject 的 addopts="-m 'not network'" 默认排除真实网络用例，离线可绿（C4）
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # 构建上下文锁定 apps/web，锁文件 apps/web/pnpm-lock.yaml（C3）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build (standalone)
        run: pnpm build

  desktop:
    name: Desktop (static check, no Electron download)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `node --test` 的 glob 匹配是 Node 21+ 的能力，而 package.json 里的 glob 是**带引号**的
          # （sh 不展开），Node 20 下会把它当成一个不存在的文件路径而 MODULE_NOT_FOUND。
          # 不去掉引号是因为 Windows 上 cmd / PowerShell 都不展开 glob，本地 `npm test` 会失效——
          # 抬版本是一处改动、两边都真。frontend / backend 两个 job 的版本与本条无关，不动。
          node-version: "22"
      # desktop/ 无 lockfile（故不用 npm ci）；--ignore-scripts 跳过 electron postinstall 的 ≈111 MB
      # 二进制下载（与 spec D6/R9「CI 只做静态校验、绝不下载 120 MB Electron」一致，job 秒级且不抖）。
      # npm-run-all 等纯 JS 包仍正常装，node --check 不需 electron 二进制。
      - name: Install (no scripts, no Electron binary)
        run: npm install --ignore-scripts --no-audit --no-fund
      # check:* 含 verify-dist.mjs（check:verifydist，P1-4），覆盖本轮核心新文件的语法。
      # make-icons.py 为 Python，node --check 不覆盖，靠运行时 `npm run icons` 保障（如实声明）。
      - name: Static syntax check
        run: npm run check
      # 这些用例只依赖 node 内置与 src/lib 下的纯模块，不需要 Electron 二进制（与 --ignore-scripts 兼容）。
      # 它们此前从未被任何门禁跑过，却守着「打包默认注入两个自动交易总闸」这类一旦回归就会静默
      # 改变生产行为的断言（spec D5b）。
      - name: Unit tests
        run: npm test
