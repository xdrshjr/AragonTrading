# Aragon Trading — 一键容器编排 (spec §4.5 / F5)。
#   docker compose up --build   ->   web:18761 + quant:18760
#
# 端口：刻意用不常用端口（避开 3000/8000 等常见占用），与本地 dev 一致。
# 真实数据硬约束（R5）：容器内仍需能连通 OKX（透传 HTTP(S)_PROXY/ALL_PROXY），
# 否则按硬约束显式报错、绝不以假数据兜底。NEXT_PUBLIC_PY_WS_URL 用"浏览器可达"地址
# （ws://localhost:18760，仅同机浏览器有效；远程部署须改为宿主可达地址）。
services:
  quant:
    build:
      context: ./services/quant
    ports:
      - "18760:18760"
    environment:
      # 透传代理给后端 httpx / websockets（OKX 在部分地区受限）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      # 缓存回退默认关闭（不可达即显式报错）；如需演示缓存横幅可置 true
      - ALLOW_CACHED_FALLBACK=${ALLOW_CACHED_FALLBACK:-false}
      - DB_PATH=/data/aragon.db
      # 信任边界（trust-boundary-and-signal-integrity D1）：后端按 Origin 白名单拒绝跨源请求。
      # 默认白名单是 http://localhost:18761 / http://127.0.0.1:18761，只对**同机浏览器**成立；
      # 远程部署时浏览器地址栏里的 host 不是 localhost，必须在这里显式给出，否则页面打得开但
      # 每个请求都回 403（与上方 NEXT_PUBLIC_PY_WS_URL 那条注释是同一个「宿主可达地址」问题）。
      - SECURITY_ALLOWED_ORIGINS=${SECURITY_ALLOWED_ORIGINS:-}
    volumes:
      - aragon-db:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # NEXT_PUBLIC_* 在 build 期注入（baked 进前端 bundle）；浏览器直连 WS 用主机端口
        NEXT_PUBLIC_PY_WS_URL: ws://localhost:18760
    ports:
      - "18761:18761"
    environment:
      # Next 服务端 rewrite 代理目标走 compose 内网服务名
      - PY_BACKEND_URL=http://quant:18760
    depends_on:
      - quant
    restart: unless-stopped

volumes:
  aragon-db:
